stages:
  - lint
  - test

shellcheck:
  stage: lint
  image: koalaman/shellcheck-alpine:stable
  script:
    - shellcheck health_check.sh

python-lint:
  stage: lint
  image: python:3.12-slim
  script:
    - pip install --quiet ruff
    - ruff check .

pytest:
  stage: test
  image: python:3.12-slim
  script:
    - pip install --quiet pytest
    - pytest -v

health-check-smoke:
  stage: test
  image: ubuntu:24.04
  script:
    - apt-get update -qq && apt-get install -y -qq procps > /dev/null
    - bash health_check.sh -d 99 -m 99 -l 10 || true   # CI runners vary; just prove it runs
